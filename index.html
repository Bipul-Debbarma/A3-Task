<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <main>
        <nav>
            <img id="logo" src="./squid_game_PNG35.png">
            <div class="p">   
                <p>About</p>
                <p id="watchNow">Watch now</p>
                <p>Actors</p>
                <p>Contract</p>
            </div>
            <i class="ri-menu-3-fill"></i>
        </nav>

        <div class="heroleft">
            <div class="bg">
               <img id="bigLogo" src="./squid_game_PNG35.png">
               <img id="star" src="./star.png">
               <img id="star2" src="./star.png">
            </div>
            <p id="hlP">Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>Season 1: 9 Episodes</p>
            <div class="view">
                <div class="play">
                    <div class="circle">
                        <i class="ri-arrow-drop-right-fill"></i>
                    </div>
                    <P>Play Now</P>
                </div>

            <div class="watch">
                 <p><i class="ri-arrow-drop-right-fill"></i>Watch Trailer</p>
            </div>
        </div>

        <div class="heroright">
            <img id="character" src="./charactor.png">
        </div>

        <div class="sl">
            <p>SCROLL</p>
            <div class="line"></div>
        </div>

        <div class="sm">
            <img src="./IMG_6603-removebg-preview.png">
            <img src="./IMG_6604-removebg-preview.png">
            <img src="./fb-removebg-preview.png">
        </div>

        <div class="series">
                <img id="ep" src="./box1.jpg">
                <img id="ep" src="./box2.jpg">
                <img id="ep" src="./box3.jpg">
                <div class="c1">
                    <i class="ri-arrow-drop-right-fill"></i>
                </div>
                <div class="c2">
                        <i class="ri-arrow-drop-right-fill"></i>
                </div>
                <div class="c3">
                    <i class="ri-arrow-drop-right-fill"></i>
                </div>
        </div>

    </main>
</body>
</html>
